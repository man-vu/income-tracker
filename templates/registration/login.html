{% extends "base.html" %}

{% block content %}
<div class="card" style="max-width: 500px; margin: 1rem auto;">
    <h1>Login</h1>
    <form method="post" style="margin-top: 1rem;">
        {% csrf_token %}
        <p>
            <label for="id_username">Username</label>
            <input id="id_username" type="text" name="username" required>
        </p>
        <p>
            <label for="id_password">Password</label>
            <input id="id_password" type="password" name="password" required>
        </p>
        <button class="btn" type="submit">Login</button>
        <a class="btn btn-link" href="{% url 'register' %}">Register</a>
    </form>
</div>
{% endblock %}
