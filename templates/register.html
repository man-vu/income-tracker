{% extends "base.html" %}

{% block content %}
<div class="card" style="max-width: 500px; margin: 1rem auto;">
    <h1>Register</h1>
    <form method="post" style="margin-top: 1rem;">
        {% csrf_token %}
        {{ form.as_p }}
        <button class="btn" type="submit">Register</button>
        <a class="btn btn-link" href="/accounts/login/">Already have an account?</a>
    </form>
</div>
{% endblock %}
