{% extends "base.html" %}

{% block content %}
<div class="card" style="max-width: 500px; margin: 1rem auto;">
    <h1>Add Expense</h1>
    <form method="post" style="margin-top: 1rem;">
        {% csrf_token %}
        {{ form.as_p }}
        <button class="btn" type="submit">Save</button>
        <a class="btn btn-link" href="{% url 'dashboard' %}">Cancel</a>
    </form>
</div>
{% endblock %}
