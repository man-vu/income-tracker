{% extends "base.html" %}

{% block content %}
<h1>Budgets</h1>
<div class="grid-2" style="margin-top: 1rem;">
    <div class="card">
        <h2>Add Budget</h2>
        <form method="post">
            {% csrf_token %}
            {{ form.as_p }}
            <button class="btn" type="submit">Save</button>
        </form>
    </div>
    <div class="card">
        <h2>Current Budgets</h2>
        <table>
            <thead>
                <tr><th>Category</th><th>Limit</th><th></th></tr>
            </thead>
            <tbody>
                {% for budget in budgets %}
                <tr>
                    <td>{{ budget.category }}</td>
                    <td>${{ budget.monthly_limit }}</td>
                    <td>
                        <form method="post" action="{% url 'delete_budget' budget.id %}">
                            {% csrf_token %}
                            <button class="btn btn-danger" type="submit">Delete</button>
                        </form>
                    </td>
                </tr>
                {% empty %}
                <tr><td colspan="3">No budgets yet.</td></tr>
                {% endfor %}
            </tbody>
        </table>
    </div>
</div>
{% endblock %}
